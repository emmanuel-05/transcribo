name: 🚀 Déploiement Continu (CD) - Production

# ------------------------------------------------------------------------------
# Déclencheurs du Workflow
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - main       # Déclenchement sur chaque push sur main
  workflow_dispatch: # Déclenchement manuel via GitHub Actions UI

concurrency:
  group: production_environment
  cancel-in-progress: true

jobs:
  # ============================================================================
  # ÉTAPE 2 : Déploiement sur le Serveur VPS via SSH & Docker Compose
  # ============================================================================
  deploy:
    name: Déploiement VPS 
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Copy project files via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ secrets.SERVER_PROJECT_PATH }}
          strip_components: 1
          rm: true

      - name: Execution de la mise à jour sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Connexion SSH établie sur le serveur distant."
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            
            echo "Récupération des dernières modifications Git..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "Vérification de la présence du fichier .env.docker..."
            if [ ! -f .env.docker ]; then
              echo "Le fichier .env.docker n'existe pas. Création automatique avec les variables GitHub..."
              cat << EOF > .env.docker
            # ==============================================================================
            # CONFIGURATION DOCKER & SERVICES (Production / Staging)
            # ==============================================================================
            
            # --- Base de Données PostgreSQL ---
            POSTGRES_DB=${{ vars.POSTGRES_DB }}
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_PORT=${{ vars.POSTGRES_PORT }}
            DATABASE_URL=${{ vars.DATABASE_URL }}
            
            # --- Redis ---
            REDIS_PORT=${{ vars.REDIS_PORT }}
            REDIS_URL=${{ vars.REDIS_URL }}
            
            # --- MinIO (Stockage S3) ---
            MINIO_ROOT_USER=${{ vars.MINIO_ROOT_USER }}
            MINIO_ROOT_PASSWORD=${{ vars.MINIO_ROOT_PASSWORD }}
            MINIO_API_PORT=${{ vars.MINIO_API_PORT }}
            MINIO_CONSOLE_PORT=${{ vars.MINIO_CONSOLE_PORT }}
            S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
            S3_ACCESS_KEY=${{ vars.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ vars.S3_SECRET_KEY }}
            
            # --- Ports & URLs des Applications ---
            BACKEND_PORT=${{ vars.BACKEND_PORT }}
            FRONTEND_PORT=${{ vars.FRONTEND_PORT }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            
            # --- Sécurité ---
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            
            # --- Clés d'API Externes ---
            DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            CONVERTIO_API_KEY=${{ secrets.CONVERTIO_API_KEY }}
            EOF
              echo "Fichier .env.docker généré avec succès depuis les variables GitHub !"
            else
              echo " Le fichier .env.docker existe déjà. Conservation de vos secrets actuels."
            fi
            
            echo "Redémarrage des containers Docker Compose..."
            docker compose --env-file .env.docker down --remove-orphans
            docker compose --env-file .env.docker up -d --build
            
            echo "Nettoyage des images Docker inutilisées..."
            docker image prune -f
            
            echo "Déploiement terminé avec succès !"

  # ============================================================================
  # ÉTAPE 3 : Health Check (Vérification de Disponibilité)
  # ============================================================================
  health-check:
    name: Health Check (Statut Service)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Test de l'application
        run: |
          echo "Attente de 15 secondes..."
          sleep 15
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" http://${{ secrets.SSH_HOST }}:3000/ || echo "000")
          echo "Code réponse HTTP: $STATUS_CODE"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo " Application en ligne !"
          else
            echo "Statut reçu: $STATUS_CODE"
          fi