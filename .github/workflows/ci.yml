name: CI - Vérification du Projet

on:
  push:
    branches:
      - main

jobs:
  check-frontend:
    name: Lint et vérification du frontend
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Installer les dépendances du frontend
        run: |
          cd frontend
          npm install

      - name: 4. Vérifier les erreurs de code (Lint)
        run: |
          cd frontend
          npm run lint