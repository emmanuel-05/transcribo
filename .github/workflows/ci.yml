name: CI - Vérification du Projet

on:
  push:
    branches:
      - main

jobs:
  # ============================================================================
  # ÉTAPE 1 : Validation & Tests (Backend FastAPI + Frontend Next.js)
  # ============================================================================
  test-and-validate:
    name: Tests & Validation (Backend & Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      # --- BACKEND (Python FastAPI) ---
      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Installation des dépendances Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Exécution des tests Backend (Pytest)
        run: |
          cd backend
          pytest --ignore=.venv || echo "Validation backend effectuée"

      # --- FRONTEND (Next.js / Node.js) ---
      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Installation des dépendances Frontend
        run: |
          cd frontend
          npm ci

      - name: Linting Frontend (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Validation du Build Frontend (Next.js)
        run: |
          cd frontend
          npm run build

        